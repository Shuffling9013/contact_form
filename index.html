<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact form</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./src/index.css" />
    <script type="module" src="./src/index.ts"></script>
  </head>
  <body>
    <main>
      <form aria-labelledby="form-heading">
        <h1 id="form-heading">Contact Us</h1>

        <div>
          <label for="first-name"> First Name * </label>
          <input
            id="first-name"
            type="text"
            name="first-name"
            required
            aria-errormessage="first-name-error"
          />
          <span
            id="first-name-error"
            role="alert"
            aria-live="assertive"
            aria-hidden="true"
          />
        </div>

        <div>
          <label for="last-name"> Last Name * </label>
          <input
            id="last-name"
            type="text"
            name="last-name"
            required
            aria-errormessage="last-name-error"
          />
          <span
            id="last-name-error"
            role="alert"
            aria-live="assertive"
            aria-hidden="true"
          />
        </div>

        <div>
          <label for="email"> Email Address * </label>
          <input
            id="email"
            type="email"
            name="email"
            required
            aria-errormessage="email-error"
          />
          <span
            id="email-error"
            role="alert"
            aria-live="assertive"
            aria-hidden="true"
          />
        </div>

        <fieldset aria-errormessage="query-type-error">
          <legend>Query Type *</legend>
          <label>
            <input type="radio" name="query-type" value="general" required />
            General Enquiry
          </label>
          <label>
            <input type="radio" name="query-type" value="support" />
            Support Request
          </label>
          <span
            id="query-type-error"
            role="alert"
            aria-live="assertive"
            aria-hidden="true"
          />
        </fieldset>

        <div>
          <label for="message"> Message * </label>
          <textarea
            id="message"
            name="message"
            required
            aria-errormessage="message-error"
          ></textarea>
          <span
            id="message-error"
            role="alert"
            aria-live="assertive"
            aria-hidden="true"
          />
        </div>

        <div>
          <label>
            <input
              type="checkbox"
              name="agree-contact"
              required
              aria-errormessage="agree-contact-error"
            />
            I consent to being contacted by the team *
          </label>
          <span
            id="agree-contact-error"
            role="alert"
            aria-live="assertive"
            aria-hidden="true"
          />
        </div>

        <button type="submit">Submit</button>
      </form>

      <section aria-labelledby="toast-heading" hidden>
        <h2 id="toast-heading">Message Sent!</h2>
        <p>Thanks for completing the form. We'll be in touch soon!</p>
      </section>
    </main>
  </body>
</html>
